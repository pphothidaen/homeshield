[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeshield"
version = "1.2.0"
description = "HomeShield: Autonomous Edge Cyber-Shield & Anti-Scam Gateway for Home Networks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Pansakorn Phothidaen"}
]
keywords = [
    "homeshield",
    "adblock",
    "dns-sinkhole",
    "dnsmasq",
    "privacy",
    "anti-scam",
    "smart-tv",
    "android-tv",
    "google-tv",
    "debloat",
    "adb",
    "rust",
    "embedded",
    "router",
    "zte",
    "openwrt",
    "asuswrt",
    "busybox",
    "iptables",
    "network-security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pycryptodome>=3.19.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://pphothidaen.github.io/homeshield/"
Repository = "https://github.com/pphothidaen/homeshield"
Issues = "https://github.com/pphothidaen/homeshield/issues"
Changelog = "https://github.com/pphothidaen/homeshield/blob/main/CHANGELOG.md"

[project.scripts]
homeshield = "homeshield:main"

[tool.pytest.ini_options]
pythonpath = ["."]
